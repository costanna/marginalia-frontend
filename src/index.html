<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Marginalia</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Escribe un texto en inglés y recibe correcciones explicadas, como las notas que un profesor escribe al margen."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbf8f3" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Sets the theme BEFORE the first paint, so the page never flashes the wrong colours.
      (function () {
        try {
          var saved = localStorage.getItem('marginalia.theme') || 'system';
          var dark =
            saved === 'dark' ||
            (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
